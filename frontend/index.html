<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/games.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#faf9f5" />
    <script>
      // Set the saved appearance before styles load to avoid a flash on refresh.
      let appearance = 'system'
      try {
        appearance = localStorage.getItem('games-appearance') || 'system'
      } catch {}
      const theme = appearance === 'light' || appearance === 'dark'
        ? appearance
        : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
      document.documentElement.dataset.theme = theme
      document.documentElement.style.colorScheme = theme
    </script>
    <meta name="description" content="Free tabletop games for your browser. Meet friends in online rooms or challenge the computer. No downloads or accounts needed." />
    <title>Games — A little play goes a long way.</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
