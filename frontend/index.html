<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/games.svg" />
    <!-- Installable: the manifest, and what iOS reads instead of it. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Games" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#faf9f5" />
    <script>
      // Set the saved appearance before styles load to avoid a flash on refresh.
      let appearance = 'system'
      try {
        appearance = localStorage.getItem('games-appearance') || 'system'
      } catch {}
      const theme =
        appearance === 'light' || appearance === 'dark'
          ? appearance
          : matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light'
      document.documentElement.dataset.theme = theme
      document.documentElement.style.colorScheme = theme
    </script>
    <meta
      name="description"
      content="Play Hearth & Home, Estate, Gambit, Prism, and Wildrise: free tabletop games for your browser. Meet friends in online rooms or challenge the computer. No downloads or accounts needed."
    />
    <!-- Fonts as a <link>, not a CSS @import: the browser finds it while parsing
         this file instead of after downloading and parsing the stylesheet. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;450;500;550;600;650;700&family=Manrope:wght@400;500;600;650;700;750;800&display=swap"
    />
    <title>Games — A little play goes a long way.</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
